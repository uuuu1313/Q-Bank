name: Build QBank

# 태그 push 또는 수동 실행 시 Windows/macOS 실행 파일을 동시에 빌드
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QBank-windows
            zip: QBank-windows.zip
          # Intel(x86_64) 러너 사용: PyQt5 5.15.9의 arm64 wheel이 없어
          # macos-latest(arm64)에선 소스 컴파일→qmake 부재로 실패함.
          # x86_64 빌드는 Intel + Apple Silicon(Rosetta 2) 모두에서 실행됨.
          - os: macos-13
            artifact: QBank-macos
            zip: QBank-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --prefer-binary: 소스(tar.gz) 대신 미리 빌드된 wheel을 우선 사용
          pip install --prefer-binary -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean QBank.spec

      # macOS: .app 번들은 내부 심볼릭 링크가 있어 ditto로 압축해야 실행 가능한 상태가 유지됨
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/QBank.app "${{ matrix.zip }}"

      # Windows: 단일 exe 압축
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/QBank.exe -DestinationPath "${{ matrix.zip }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}
